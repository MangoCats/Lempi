[package]
name = "lempi-android"
version = "0.1.0"
edition = "2021"
description = "The phone's way into the player: its UniFFI interface, and the JNI init"
license = "MIT"

# **`[REQ-AND-410]`: a generated interface, and one hand-written entry.** The
# device spike `[GDE-APP-020]` ran on three hand-written JNI entries, and
# passed on 2026-09-26. Since then `start`, `command`, `state` and `stop` are
# UniFFI exports, generated for Kotlin, and `init` alone stays hand-written,
# because it takes the Android context.
#
# A workspace member, not a default one: `cargo test` at the root does not
# build it, and on any host but Android it compiles to an empty library, since
# every line is `cfg(target_os = "android")`.

[lib]
name = "lempi_android"
crate-type = ["cdylib"]

[target.'cfg(target_os = "android")'.dependencies]
# Built as a phone links it: no `appliance` (no sudo routes), no `echo-client`
# (a phone neither leads nor follows, `[REQ-AND-180]`).
lempi-player = { path = "..", default-features = false }
# The versions cpal's own Android backend already resolves, so the context
# handed over here is the one cpal reads back `[GDE-HST-330]`.
tracing = { version = "0.1", default-features = false, features = ["std"] }
# jni-sys 0.4 groups the function table by JNI version: `(**env).v1_2.X`.
jni-sys = "0.4"
ndk-context = "0.1"
libc = "0.2"
# The app's interface [REQ-AND-410]: `start`, `command`, `state` and `stop`,
# generated for Kotlin by `uniffi-bindgen` from this library. `init` stays a
# hand-written JNI entry, since it takes the Android context. Pinned: the
# generator must be the same release.
uniffi = "=0.32.2"
