name: docs

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  check-docs:
    name: check_docs.py --strict
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.x"
      # [GOV-DOC-040]: errors, which fail the build -- tag collisions,
      # dangling tags, unresolvable links, a `#fragment` naming no section,
      # a document number used twice in one folder, a heading disagreeing
      # with its filename, an over-length document, and a code-scan pattern
      # matching no file. Warnings, which do not -- a doc-cited path missing
      # from the tree, a tag defined twice, and the registered debt in
      # check_docs.py's own OUTSTANDING sets. See its module docstring.
      - run: python tools/check_docs.py --strict
      # [GOV-FBN-010]: a retired project name belongs in exactly one file.
      # The guard reads its search terms out of that file at run time, and
      # exits non-zero if the file is missing or its token block is empty,
      # rather than reporting a clean scan it never performed [GOV-FBN-020].
      - run: python tools/check_forbidden_names.py --strict
      # [SecurityReview N1] fleet-leak scan, strict, against the baseline
      # [SPEC-FCP-050]. There is no fleet/ in CI, so it runs generic-only and
      # says so [GOV-FBN-020]. The tree's existing detail -- left as it is,
      # decided 2026-09-28 -- is accepted by hash in the baseline, which only
      # shrinks [SPEC-FCP-055]; any other finding fails the build, so a leak
      # committed where the hook is not installed is still caught here.
      - run: python tools/check_fleet_leaks.py --strict --baseline tools/fleet-leaks-baseline.txt
