# Lempi: do not tie the BlueZ monitor to seat state [PI3-FOUND-040], in
# WirePlumber 0.5's form [LP3-BT-010]. lempi02w (bookworm, WirePlumber 0.4)
# says the same in Lua. Every ssh login and logout otherwise withdraws all
# A2DP endpoints and drops the speaker. One user, one seat.
wireplumber.profiles = {
  main = {
    monitor.bluez.seat-monitoring = disabled
  }
}
