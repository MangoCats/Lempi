# lempiplay3's swap: zram only, one times RAM, capped at 2 GiB.
#
# Installed as /etc/rpi/swap.conf.d/10-lempi.conf by setup-lp3.sh.
#
# **Written 2026-09-25 as the fix, not as what the card had.** The card ran
# rpi-swap's default `Mechanism=auto` -- zram+file -- and, measured that day,
# had **no swap at all** (`free`: Swap 0; `dev-zram0.swap` inactive,
# `rpi-zram-writeback.timer` failed). It is bose's fault exactly
# [IMPL-BOS-170]: the file half wants /var/swap on the RAM-backed overlay, and
# the chain it needs is broken on an overlay root. IMPL016 had recorded this
# node as "already on zram" [IMPL-VP3-010] from its configuration, not from
# `free`.
#
# zram only, as bose: one times RAM is 905 MiB on this Pi 3, well under the
# cap.
[Main]
Mechanism=zram

[Zram]
RamMultiplier=1
MaxSizeMiB=2048
