# Lempi: a new output starts at the jack's old level [LP3-BT-010]. Before
# PipeWire the player opened the jack directly at 0 dB; WirePlumber gives a
# device it has not seen before 0.4^3 (0.064, linear), which put the jack at
# -19.9 dB on 2026-10-02 -- 20 dB quieter. 0.631 is 0 dB on this jack (its
# mixer reaches +4 dB at 1.0), and a newly paired speaker starts there too.
# A level someone has chosen since is remembered in ~pi/.local/state and wins.
wireplumber.settings = {
  device.routes.default-sink-volume = 0.631
}
