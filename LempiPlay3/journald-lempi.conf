# lempiplay3's journal: kept, on STATE, and bounded -- bose's values.
#
# Installed as /etc/systemd/journald.conf.d/lempi.conf by setup-lp3.sh.
#
# **Found 2026-09-25: this node had never kept a journal across a reboot.**
# Raspberry Pi OS trixie ships
# /usr/lib/systemd/journald.conf.d/40-rpi-volatile-storage.conf with
# `Storage=volatile`, and nothing here overrode it -- so journald wrote to
# /run/log/journal (RAM) and every reboot erased it, although /var/log had
# been bound onto STATE precisely so that logs would survive [IMPL-VP3-160].
# bose has had this override since it was provisioned; this is the same file.
[Journal]
Storage=persistent
SystemMaxUse=64M
RuntimeMaxUse=8M
