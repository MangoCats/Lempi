# Lempi's PipeWire clock [LP3-BT-010]: lempi02w's two settings in one file.
# 44.1 kHz, the library's rate, so nothing resamples for nothing
# [PI2-RATE-010]; and its quantum (LempiPi/pipewire-quantum.conf).
context.properties = {
    default.clock.rate          = 44100
    default.clock.allowed-rates = [ 44100 ]
    default.clock.quantum       = 4096
    default.clock.min-quantum   = 2048
    default.clock.max-quantum   = 8192
}
