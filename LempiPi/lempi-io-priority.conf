# Give the player's I/O precedence over everything else on the card.
# Installed as /etc/systemd/system/lempi.service.d/20-lempi-io.conf.
#
# **What this is not.** It was added believing SD contention was starving the
# output ring and causing the periodic stutters `[PI3-FOUND-200]`. The startup
# underruns were real, but the stutters were not this -- they were where the
# appliance was physically sitting `[PI3-FOUND-320]` -- and the 19 s → 1.9 s
# startup improvement measured alongside it belongs to `mpd` being made to
# yield `[PI3-FOUND-210]`, not to this file. **No measurement here is evidence
# for this setting.**
#
# **Why it is kept anyway.** The decoder reads audio off the same card that
# serves a 1.1 GB catalog, and on an appliance whose whole purpose is playing
# music the process doing the playing is the right one to win that queue. It
# is defensible on its own terms rather than on the finding that prompted it,
# which is the distinction worth recording: a setting justified only by a
# retired theory should be deleted, and this one is not.
#
# It is deliberately process-wide and therefore blunt -- it raises background
# threads along with the decoder. The Director rebuild, which is the only
# heavy one, lowers itself per-thread from inside `[PI3-FOUND-220]`, and that
# per-thread call wins over this. `bfq` must be the elevator for either to
# mean anything at all `[PI3-FOUND-250]`; see `sd-tuning.conf`.
[Service]
IOSchedulingClass=best-effort
IOSchedulingPriority=0
