# The appliance's journal: kept across power cuts, bounded in size and age
# [PI3-FOUND-770].
#
# Installed as /etc/systemd/journald.conf.d/10-lempi.conf.
#
# **Captured 2026-09-25 from lempi02w, where it was set by hand** -- in
# /etc/systemd/journald.conf itself, dated 2026-09-09, and written by no
# script. PI020 still described the journal as returned to volatile. The
# values are the machine's, unchanged; only where they live is new.
#
# - `Storage=persistent`: a power cut is how this appliance stops
#   [PI3-FOUND-120], and a volatile journal loses the evidence of whatever
#   went wrong just before it. Three power cycles were investigated blind
#   before this was on [PI020].
# - `SystemMaxUse=64M`: the SD card's share. The same bound bose uses
#   (BosePi/provision-bose.sh).
# - `MaxRetentionSec=1week`: enough to span a problem noticed days later.
#   It holds only once the timer ticks stop filling the 64 MB in under three
#   days [PI3-FOUND-760].
[Journal]
Storage=persistent
SystemMaxUse=64M
MaxRetentionSec=1week
