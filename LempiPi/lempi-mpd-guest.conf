# Attach MPD as a guest backend [SPEC-BK-020]. Lempi still plays; MPD is
# idle until a switch asks for it, and the control is only offered because
# this flag is here.
#
# Installed as /etc/systemd/system/lempi.service.d/mpd-guest.conf.
#
# **This file also carries the split-database paths [IMPL-DBSPLIT-025]**, and
# is therefore the only place the appliance's real command line exists. It was
# living on the SD card and nowhere else until 2026-09-09; `setup-lempipi.sh`
# writes the base unit with the pre-split single-database argument, so an
# appliance rebuilt from the repository alone would have come up reading the
# catalog as its listener store. Captured here so a dead card costs an image
# and not a configuration nobody wrote down.
#
# **`After=mpd.service` was here and has been removed on purpose.** It sat in
# `[Service]`, where systemd does not accept ordering directives, so it never
# had any effect -- and that was the lucky outcome. Moved to `[Unit]` where it
# would work, it would hold the player behind MPD's ~10 s start on a machine
# whose stated priority is audio first, for a backend that is idle until
# somebody switches to it. The line is dropped rather than corrected so that
# nobody later "fixes" it into a ten-second regression.
# **This is the second of lempipi's two ExecStart lines.** The base unit
# `setup-lempipi.sh` writes carries one; this drop-in blanks it with the
# empty `ExecStart=` below and supplies its own, which is why `systemctl show`
# reports two. Both must be migrated to the named form [GDE-CLI-080]; the
# machine itself has not been touched.
[Service]
ExecStart=
ExecStart=/usr/local/bin/lempi --listener /var/lempi/listener.db --library /srv/library/library.db --port 5720 --mpd 127.0.0.1:6600 --mpd-root /srv/library/audio
