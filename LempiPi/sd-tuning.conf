# SD card tuning for an appliance that must keep audio flowing [PI3-FOUND-250].
#
# bfq, not mq-deadline: mq-deadline has no notion of I/O priority classes, so
# IOSchedulingClass=idle on the Director rebuild was inert -- it read 256 MB at
# 15 MB/s straight through the start of playback while nominally yielding. BFQ
# is the only scheduler here that implements ioprio, which is what makes
# polite mean anything.
#
# 512 KB readahead: audio files are read sequentially while the card is also
# serving a 1.1 GB library database.
w /sys/block/mmcblk0/queue/scheduler - - - - bfq
w /sys/block/mmcblk0/queue/read_ahead_kb - - - - 512
