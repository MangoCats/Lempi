# MPD is a guest backend here: configured, but idle until someone switches to
# it [SPEC-BK-020]. It has no claim on the SD card or the CPU while Lempi is
# starting, and it starts concurrently with the player on a machine whose
# stated priority is audio first. It took 9.8s of a boot that reaches audio at
# 63s, on the one card the decoder also reads from.
#
# So it is made polite rather than delayed: idle I/O means it yields the card
# to anything else that wants it, and Nice=10 keeps it off the CPU while the
# player is still opening its output. Nothing is disabled -- switching to the
# MPD backend still works exactly as before, it just no longer competes with
# getting sound out of the speaker.
[Service]
Nice=10
IOSchedulingClass=idle
