# MPD as Lempi's guest on the appliance `[SPEC-BK-020]`.
#
# Lempi remains the player. This is a second way for the same audio to reach
# the same speaker, so that other people's clients — Cantata, MALP, ncmpcpp —
# can drive the library `[SPEC-MPD-050]`.
#
# Installed by hand rather than by a script, and kept in the repository so the
# appliance's configuration is not the only copy of it.

# The library Lempi plays. MPD reads it; nothing here writes to the audio.
music_directory     "/srv/library/audio"

# Under /srv rather than /var/lib/mpd, because this runs as `pi` and not as the
# packaged `mpd` user — see the systemd drop-in for why.
db_file             "/srv/library/mpd/database"
state_file          "/srv/library/mpd/state"
sticker_file        "/srv/library/mpd/sticker.sql"
playlist_directory  "/srv/library/mpd/playlists"
pid_file            "/run/user/1000/mpd.pid"

# **Reachable from the house, not from the world.** The point of a guest
# backend is that a phone on the sofa can drive it, so binding to localhost
# only would defeat it. The appliance sits behind a domestic router; there is
# no password, exactly as Lempi's own web interface has none.
bind_to_address     "0.0.0.0"
port                "6600"

# Lempi tells MPD what to play and reads back what happened, so nothing here
# should decide anything on its own.
auto_update         "no"
restore_paused      "yes"

# **Through PipeWire, because that is where the speaker is.** Both players must
# feed one sink and let PipeWire mix them, rather than contend for the device
# `[SPEC-BK-030]`.
#
# **`alsa` with `device "default"`, which *is* PipeWire here** -- its ALSA
# compatibility device, not the sound card. The two more obvious choices were
# tried first and both failed, in different ways and neither of them loudly:
#
#   - `pipewire`, the native plugin, linked to the sink and was **never
#     scheduled** -- quantum 0 in `pw-top` -- while MPD reported a live bitrate.
#   - `pulse` *was* scheduled, at quantum 8192, links active, volumes 1.00,
#     pacing at exactly 1.0x real time. RMS 0 at the speaker.
#
# The same MPD writing to a `pipe` output measured RMS 12,138 throughout, so
# the samples were always there; those two routes simply dropped them. Lempi
# has always reached this speaker through ALSA, so MPD is pointed at what is
# known to carry sound rather than at what looks most native `[PI-CHR-090]`.
#
# Measured by recording the speaker. MPD's own status agreed with all three.
audio_output {
    type            "alsa"
    name            "Lempi guest"
    device          "default"
    format          "44100:16:2"
}


# **A mixer, because without one nothing can change the volume while MPD
# plays** `[SPEC-MPD-140]`.
#
# `none` was the first choice, reasoning that volume is Lempi's business
# `[REQ-AUD-154]` and a second mixer would be a second idea of loudness. That
# was wrong in a way only the appliance showed. Lempi applies its fader as gain
# inside its **own** output ring, and MPD's audio never passes through it — so
# with no mixer here, MPD played at whatever level it liked and neither Lempi's
# fader nor a guest client's slider could touch it. A client's volume control
# reported "no mixer" and did nothing.
#
# It also cost the fade. Handing playback *away* from MPD is built from
# `setvol` steps, and `setvol` is refused outright without a mixer
# `[SPEC-MPD-099]` — so every switch away from MPD cut rather than faded, and
# MPD's log filled with `exception: No mixer`.
#
# `software` rather than `hardware`: the sink is a Bluetooth speaker reached
# through PipeWire, and a hardware mixer would be the *device's* volume, shared
# with everything else on the machine.
mixer_type          "software"
