# Run MPD as the user that owns the sound `[SPEC-BK-060]`.
#
# PipeWire runs in `pi`'s session and its socket lives in /run/user/1000.
# Debian's packaged unit runs MPD as the `mpd` user, which cannot reach that
# socket at all — so MPD would come up, find no output, and play silently into
# nothing while reporting itself healthy. That is the same failure mode
# `[IMPL-AUD-010]` describes for a missing device, and it is worth avoiding by
# construction rather than by noticing.
#
# The three lines below are copied deliberately from lempi.service: the two
# processes must agree about where the audio server is, or only one of them
# will find it.
#
# Installed as /etc/systemd/system/mpd.service.d/lempi.conf

[Service]
User=pi
Group=pi
Environment=XDG_RUNTIME_DIR=/run/user/1000
Environment=PULSE_SERVER=unix:/run/user/1000/pulse/native
ExecStart=
ExecStart=/usr/bin/mpd --systemd /etc/mpd.conf
