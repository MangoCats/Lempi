# Buy buffer margin for Bluetooth on a Pi Zero 2W [PI3-FOUND-190].
#
# Wi-Fi and Bluetooth share one chip and one antenna here, so the A2DP stream
# is periodically starved by radio contention that no amount of CPU headroom
# prevents -- and the graph was running a 1024-frame quantum, about 21 ms, so
# any interruption longer than that glitches. Nothing in load, memory, swap or
# xruns explained the startup stutter; margin is the remaining lever.
#
# Latency cost is irrelevant for music playback with no synchronised display.
context.properties = {
    default.clock.quantum     = 4096
    default.clock.min-quantum = 2048
    default.clock.max-quantum = 8192
}
