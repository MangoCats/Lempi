# Attach MPD as a guest backend [SPEC-BK-020]. Lempi still plays; MPD is idle
# until a switch asks for it, and the control is only offered because this
# flag is here.
#
# Installed as /etc/systemd/system/lempi.service.d/mpd-guest.conf.
#
# **This file carries the node's real command line.** The empty `ExecStart=`
# discards the base unit's and the line below replaces it. A node whose
# database has been split [IMPL-DBSPLIT-025] gets both halves here, and the
# base unit's single-database line is then never used -- which is exactly how
# a rebuilt-from-the-repository appliance once came up reading its catalogue
# as its listener store.
[Service]
ExecStart=
ExecStart=/usr/local/bin/lempi --listener /var/lempi/listener.db --library /srv/library/library.db --port 13491 --mpd 127.0.0.1:6600 --mpd-root /srv/library/audio
