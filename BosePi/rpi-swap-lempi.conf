# bose's swap: zram only, one times RAM, capped at 2 GiB [IMPL-BOS-170].
#
# Installed as /etc/rpi/swap.conf.d/10-lempi.conf by provision-bose.sh.
#
# `Mechanism=zram` is the fix IMPL-BOS-170 found on 2026-09-07: rpi-swap's
# default zram+file wants a writeback file at /var/swap, which on this node
# is the RAM-backed overlay, so it cannot be made and swap never comes up.
#
# The size lines are rpi-swap's own defaults, written out 2026-09-25 so the
# size is stated here rather than implied by a package -- one times RAM
# (1,844 MiB on this Pi 4), under a 2 GiB cap. Read by `rpi-systemd-config
# rpi/swap.conf`, which the generator calls; checked by writing a probe
# drop-in and seeing the parsed value move.
[Main]
Mechanism=zram

[Zram]
RamMultiplier=1
MaxSizeMiB=2048
