# MPD as Lempi's guest on `bose` `[SPEC-BK-020]`.
#
# Differs from LempiPi/mpd.conf in two ways that matter: the state files are
# split across two partitions, and the sink is a local I2S DAC rather than a
# Bluetooth speaker `[PI-BOS-020]`.

# --- Paths: the [PI-DB-010] line, drawn again -------------------------------
#
# **The index is derived from the library, so it lives with the library.** It is
# rebuilt by `update` and it changes exactly when B changes. On `lempi02w` all
# four of these sit together under /srv/library only because that machine has no
# state partition to separate them onto; this image should not copy that.
music_directory     "/srv/library/audio"
db_file             "/srv/library/mpd/database"

# **These three are the listener's, so they live on C, which is writable.**
# Stickers are why-this-track annotations `[SPEC-MPD-050]`; the state file is
# what MPD was playing. Both are written while unattended.
state_file          "/var/lempi/mpd/state"
sticker_file        "/var/lempi/mpd/sticker.sql"
playlist_directory  "/var/lempi/mpd/playlists"
pid_file            "/run/mpd.pid"
log_file            "syslog"

# Reachable from the house, not from the world -- a phone on the sofa is the
# point of a guest backend `[SPEC-MPD-050]`.
bind_to_address     "0.0.0.0"
port                "6600"

# Lempi decides what plays; nothing here should decide anything on its own.
auto_update         "no"
restore_paused      "yes"

# --- Output: the decision this file cannot make by itself -------------------
#
# **`bose` has a hardware mixer and may not be able to use it.** The PCM512x
# offers 208 steps in the chip `[PI-BOS-030]`, which is the better volume
# control by every measure -- no arithmetic on the samples, and it is what the
# DAC is for. But reaching it requires MPD to open the card directly, and a card
# opened directly is a card the player cannot also open. `[SPEC-BK-030]`'s
# handoff needs both to sound at once, briefly.
#
# So the two are in tension, and this file takes the conservative side:
#
#   - `device "default"` and a **software** mixer, matching the arrangement
#     measured working on `lempi02w` `[SPEC-MPD-140]`, where both players share
#     one sink and neither owns the hardware.
#   - The alternative -- `device "hw:sndrpihifiberry,0"` with
#     `mixer_type "hardware"` and `mixer_control "Digital"` -- is better in
#     every respect except that it is untested here and forecloses sharing.
#
# `[IMPL-BOS-090]` is the measurement that settles it, and until it is run this
# is a reasoned default and not a finding. Whoever runs it should also re-check
# `[SPEC-MPD-135]`: the seek workaround was measured against PipeWire feeding
# Bluetooth `[PI-CHR-100]`, and a local card may not need it at all.
audio_output {
    type            "alsa"
    name            "Lempi guest"
    device          "default"
    format          "44100:16:2"
}

# Software, for the reason above -- not because a mixer is unwanted. `none` was
# tried on `lempi02w` and left nothing able to set the volume while MPD played,
# and cost the fade as well `[SPEC-MPD-140]`.
mixer_type          "software"
