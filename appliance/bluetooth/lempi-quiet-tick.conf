# Keep a timer tick's routine out of the journal, and its news in it
# [PI3-FOUND-760].
#
# Installed as /etc/systemd/system/lempi-speaker.service.d/10-lempi-quiet.conf
# and /etc/systemd/system/lempi-btwatch.service.d/10-lempi-quiet.conf.
#
# **Measured 2026-09-25 on lempi02w:** 76% of the journal's 21,327 entries
# were systemd's own "Starting / Finished / Deactivated successfully" for
# these two oneshots -- 3,433 runs of the speaker keeper (every 30 s) and
# 1,717 of the controller watch (every minute), three lines a run, whether
# or not anything happened. The journal's cost is per entry (about 3 KB with
# its fields and indexes, against 1.4 MB of message text in all), so they,
# not the player, were what filled `SystemMaxUse=64M` -- and it held 2.7
# days where `MaxRetentionSec=1week` asked for seven.
#
# Two lines, and both are needed:
#
# - `LogLevelMax=notice` drops the unit's info-level lines -- including, on
#   systemd 252, the service manager's own lines *about* the unit, which is
#   the point. Failure is still logged: "Main process exited" is notice,
#   "Failed with result" warning, "Failed to start" err. Measured with a
#   throwaway unit that exited 1.
# - `SyslogLevel=notice` makes what the scripts themselves print default to
#   notice, so it survives the filter above. Without it this would also have
#   hidden the lines worth keeping -- "connected 2C:8D:48:36:EA:2F after
#   41163s and asked the player to reopen" is a plain `echo`, info by
#   default. A `<N>` prefix in a script still overrides it.
[Service]
SyslogLevel=notice
LogLevelMax=notice
