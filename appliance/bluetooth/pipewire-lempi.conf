# Lempi's PipeWire clock, on every Bluetooth appliance [APP-BT-010].
#
# Installed as /etc/pipewire/pipewire.conf.d/10-lempi.conf. One file since
# 2026-10-02: lempi02w carried the rate in its user's
# ~/.config/pipewire/pipewire.conf.d/10-rate.conf and the quantum in
# /etc/pipewire/pipewire.conf.d/10-lempi-quantum.conf; lp3-wifi had both in
# this file [LP3-BT-010]. Read live on both that day: the same five values.
#
# - 44.1 kHz, the library's rate. The graph defaults to 48 kHz, so a default
#   install resamples for nothing and the sink may resample back
#   [PI2-RATE-010].
# - A 4096-frame quantum: margin for Bluetooth [PI3-FOUND-190]. On a Pi Zero
#   2 W, Wi-Fi and Bluetooth share one chip and one antenna, so the A2DP
#   stream is periodically starved by radio contention that no CPU headroom
#   prevents; at 1024 frames, about 21 ms, any interruption longer than that
#   glitched. Nothing in load, memory, swap or xruns explained the startup
#   stutter, and margin was the remaining lever. Latency costs nothing for
#   music with no synchronised display.
context.properties = {
    default.clock.rate          = 44100
    default.clock.allowed-rates = [ 44100 ]
    default.clock.quantum       = 4096
    default.clock.min-quantum   = 2048
    default.clock.max-quantum   = 8192
}
