# An appliance's swap on trixie: zram only, one times RAM, capped at 2 GiB
# [IMPL-BOS-170].
#
# Installed as /etc/rpi/swap.conf.d/10-lempi.conf by appliance/common.sh,
# on every node whose OS has rpi-swap. One file since 2026-10-02; bose and
# lp3-wifi each carried a copy, the settings identical and the comments not.
#
# `Mechanism=zram` is the fix IMPL-BOS-170 found on bose on 2026-09-07:
# rpi-swap's default zram+file wants a writeback file at /var/swap, which on
# an overlay root is RAM-backed, so it cannot be made and swap never comes
# up. lp3-wifi had the same fault, found 2026-09-25 with `free` showing no
# swap at all, after IMPL016 had recorded it "already on zram"
# [IMPL-VP3-010] from its configuration rather than from `free`.
#
# The size lines are rpi-swap's own defaults, written out so the size is
# stated here rather than implied by a package -- one times RAM (1,844 MiB on
# bose's Pi 4, 905 on lp3-wifi's Pi 3), under a 2 GiB cap. Read by
# `rpi-systemd-config rpi/swap.conf`, which the generator calls; checked by
# writing a probe drop-in and seeing the parsed value move.
[Main]
Mechanism=zram

[Zram]
RamMultiplier=1
MaxSizeMiB=2048
