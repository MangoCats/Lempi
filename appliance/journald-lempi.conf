# An appliance's journal: kept across power cuts, bounded in size and age
# [PI3-FOUND-770].
#
# Installed as /etc/systemd/journald.conf.d/lempi.conf by appliance/common.sh
# -- a name that sorts after trixie's 40-rpi-volatile-storage.conf, so this
# file's `Storage=` is the one that holds. **One file since 2026-10-02.** lempi02w and the other
# two each had their own, under different names, and each carried half of
# the bounds: lempi02w's limited age and not the RAM journal, theirs the RAM
# journal and not age. This is both halves.
#
# - `Storage=persistent`: a power cut is how lempi02w stops [PI3-FOUND-120],
#   and a volatile journal loses the evidence of whatever went wrong just
#   before it -- three power cycles were investigated blind before this was
#   on [PI020]. On trixie it also overrides the image's own
#   /usr/lib/systemd/journald.conf.d/40-rpi-volatile-storage.conf, which kept
#   lp3-wifi's journal in RAM although /var/log had been bound onto STATE so
#   that logs would survive [IMPL-VP3-160] (found 2026-09-25).
# - `SystemMaxUse=64M`: the card's share, the bound all three already had.
# - `RuntimeMaxUse=8M`: the journal in /run before /var/log is ready, held
#   to a few MB of RAM -- bose's bound from its provisioning, then lp3-wifi's.
# - `MaxRetentionSec=1week`: enough to span a problem noticed days later. It
#   holds only once the timer ticks stop filling 64 MB in under three days
#   [PI3-FOUND-760].
[Journal]
Storage=persistent
SystemMaxUse=64M
RuntimeMaxUse=8M
MaxRetentionSec=1week
