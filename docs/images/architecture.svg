<?xml version="1.0" encoding="utf-8"?>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 380" width="100%">
  <!-- Central Shared Database Node -->
  <g transform="translate(290, 20)">
    <rect width="220" height="70" rx="6" fill="#24292e" stroke="#444d56" stroke-width="1.5"/>
    <text x="110" y="32" fill="#ffffff" font-size="16" font-weight="600" text-anchor="middle">lempi.db</text>
    <text x="110" y="52" fill="#959da5" font-size="12" font-family="ui-monospace,SFMono-Regular,monospace" text-anchor="middle">Shared SQLite Storage</text>
  </g>

  <!-- LEFT NODE: player/ (Rust Engine) -->
  <g transform="translate(40, 150)">
    <rect width="330" height="200" rx="8" fill="#f6f8fa" stroke="#d55e2b" stroke-width="2"/>
    <path d="M 0,8 A 8,8 0 0 1 8,0 L 322,0 A 8,8 0 0 1 330,8 L 330,40 L 0,40 Z" fill="#d55e2b"/>
    <text x="15" y="25" fill="#ffffff" font-size="15" font-weight="600">player/ — Lempi Engine</text>
    <rect x="275" y="10" width="40" height="18" rx="3" fill="#ffffff" fill-opacity="0.2"/>
    <text x="295" y="23" fill="#ffffff" font-size="10" font-weight="600" text-anchor="middle">MIT</text>
    
    <g transform="translate(15, 60)" font-size="12" font-family="ui-monospace,SFMono-Regular,monospace" fill="#24292e">
      <text x="0" y="15" font-weight="bold" fill="#d55e2b">▶ Language:</text> <text x="90" y="15">Pure Rust</text>
      <text x="0" y="35" font-weight="bold" fill="#d55e2b">▶ Memory:</text> <text x="90" y="35">≤150MB RSS (Pi Zero 2W Target)</text>
      <text x="0" y="55" font-weight="bold" fill="#d55e2b">▶ Sound:</text> <text x="90" y="55">symphonia + rubato + cpal</text>
      <text x="0" y="75" font-weight="bold" fill="#d55e2b">▶ Delivery:</text> <text x="90" y="75">axum WebSockets (core.js)</text>
      <text x="0" y="110" font-family="-apple-system,BlinkMacSystemFont,sans-serif" fill="#586069" font-size="11">Continuous stream, gapless DAO, local outputs</text>
    </g>
  </g>

  <!-- RIGHT NODE: tools/ (Python Vipunen) -->
  <g transform="translate(430, 150)">
    <rect width="330" height="200" rx="8" fill="#f6f8fa" stroke="#3572A5" stroke-width="2"/>
    <path d="M 0,8 A 8,8 0 0 1 8,0 L 322,0 A 8,8 0 0 1 330,8 L 330,40 L 0,40 Z" fill="#3572A5"/>
    <text x="15" y="25" fill="#ffffff" font-size="15" font-weight="600">tools/ — Vipunen Builder</text>
    <rect x="265" y="10" width="50" height="18" rx="3" fill="#ffffff" fill-opacity="0.2"/>
    <text x="290" y="23" fill="#ffffff" font-size="10" font-weight="600" text-anchor="middle">AGPL-3.0</text>
    
    <g transform="translate(15, 60)" font-size="12" font-family="ui-monospace,SFMono-Regular,monospace" fill="#24292e">
      <text x="0" y="15" font-weight="bold" fill="#3572A5">▶ Language:</text> <text x="90" y="15">Python</text>
      <text x="0" y="35" font-weight="bold" fill="#3572A5">▶ Pipeline:</text> <text x="90" y="35">Essentia Feature Extraction</text>
      <text x="0" y="55" font-weight="bold" fill="#3572A5">▶ Ingestion:</text> <text x="90" y="55">MusicBrainz + DAO Segmenting</text>
      <text x="0" y="75" font-weight="bold" fill="#3572A5">▶ Constraint:</text> <text x="90" y="75" fill="#cb2431" font-weight="bold">Never runs on appliance</text>
      <text x="0" y="110" font-family="-apple-system,BlinkMacSystemFont,sans-serif" fill="#586069" font-size="11">Invoked on desktop machine as a subprocess only</text>
    </g>
  </g>

  <!-- DATA FLOW ARROWS (Solid Colors) -->
  <path d="M 205,150 L 205,110 L 345,110 L 345,92" fill="none" stroke="#d55e2b" stroke-width="2" stroke-dasharray="4 4"/>
  <polygon points="345,92 341,99 349,99" fill="#24292e"/>
  <text x="245" y="125" fill="#d55e2b" font-size="10" font-family="ui-monospace,monospace" font-weight="bold">Reads Schema</text>

  <path d="M 595,150 L 595,110 L 455,110 L 455,92" fill="none" stroke="#3572A5" stroke-width="2"/>
  <polygon points="455,92 451,99 459,99" fill="#24292e"/>
  <text x="495" y="125" fill="#3572A5" font-size="10" font-family="ui-monospace,monospace" font-weight="bold">Populates DDL</text>

  <line x1="399" y1="120" x2="399" y2="350" stroke="#d1d5da" stroke-width="1.5" stroke-dasharray="6 6"/>
  <text x="400" y="365" fill="#959da5" font-size="10" font-weight="600" text-anchor="middle" letter-spacing="1">NO CODE COUPLING / NO RPC</text>
</svg>